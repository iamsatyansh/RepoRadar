spring:
  application:
    name: reporadar-api
  datasource:
    url: ${REPORADAR_DATABASE_URL:jdbc:postgresql://localhost:5432/reporadar}
    username: ${REPORADAR_DATABASE_USERNAME:reporadar}
    password: ${REPORADAR_DATABASE_PASSWORD:reporadar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    cache-names: githubRepository,githubLanguages,githubCommits,githubContributors
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=15m
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    issuer: ${JWT_ISSUER:reporadar-api}
    secret: ${REPORADAR_JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  github:
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${REPORADAR_GITHUB_TOKEN:}
    api-version: ${GITHUB_API_VERSION:2022-11-28}
    request-timeout: ${GITHUB_REQUEST_TIMEOUT:PT10S}
    commit-limit: ${GITHUB_COMMIT_LIMIT:20}
    contributor-limit: ${GITHUB_CONTRIBUTOR_LIMIT:10}
